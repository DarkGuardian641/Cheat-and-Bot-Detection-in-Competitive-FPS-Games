[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cheat-bot-detection-backend"
version = "0.1.0"
description = "FastAPI backend for FPS Cheat and Bot Detection system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
py-modules = ["config", "main", "parser"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
